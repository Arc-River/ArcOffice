name: Build & Release

on:
  push:
    tags: ['v*']

jobs:
  lint:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:ci

      - name: TypeScript check
        run: pnpm typecheck

  build-mac:
    name: Build (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [lint]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron app (DMG)
        run: pnpm electron:build
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArcOffice-macOS
          path: release/
          compression-level: 0

  build-win:
    name: Build (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [lint]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron app (NSIS installer)
        run: pnpm electron:build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArcOffice-Windows
          path: release/
          compression-level: 0

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron app (AppImage + deb)
        run: pnpm electron:build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArcOffice-Linux
          path: release/
          compression-level: 0

  # ─── GitHub Release ───
  release:
    name: Create Release
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ArcOffice ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ArcOffice-macOS/*.dmg
            ArcOffice-macOS/*.zip
            ArcOffice-Windows/*.exe
            ArcOffice-Linux/*.AppImage
            ArcOffice-Linux/*.deb
