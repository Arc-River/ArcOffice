appId: com.arcoffice.desktop
productName: ArcOffice
directories:
  output: release
  buildResources: resources

asar: true
asarUnpack:
  - "**/node_modules/@anthropic-ai/**"

files:
  - dist/**/*
  - dist-electron/**/*
  - "!node_modules/**/*"

mac:
  target: [dmg, zip]
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: "${productName}-${version}-win-x64.${ext}"

linux:
  target: [AppImage, deb]
  category: Office
